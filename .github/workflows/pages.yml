name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        run: deno check src/main.ts tools/ tests/

      - name: Lint
        run: deno lint

      - name: Format
        run: deno fmt --check

      - name: Test
        run: deno test tests/

      # Pages is serving this repo from the branch root, so the built bundle is committed
      # and has to match the source. Rebuilding and diffing catches a stale commit.
      - name: Build
        run: deno task build

      - name: Committed bundle is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "dist/ is stale. Run 'deno task build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
