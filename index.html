<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Crafter</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div id="app">
		<header>
			<div id="top-bar">
				<h1>Crafter</h1>
				<div id="hud-stats" role="region" aria-label="Stats">
					<span id="hud-gold">500 gold</span>
					<span id="hud-storage">0/50 items</span>
					<span id="hud-chain"></span>
					<span id="hud-inventory"></span>
				</div>
				<button id="settings-btn" data-action="settings-open">Settings</button>
			</div>
		</header>
		<div id="content">
			<div id="treasure-container"></div>
			<details id="section-production" open>
				<summary><h2>Production</h2></summary>
				<div class="section-body">
					<div id="building-row">
						<select id="building-select" aria-label="Select building to manage"></select>
					</div>
					<div id="panel-production"></div>
				</div>
			</details>

			<details id="section-market">
				<summary><h2>Market</h2></summary>
				<div class="section-body" id="panel-market"></div>
			</details>

			<details id="section-quests">
				<summary><h2>Quests</h2></summary>
				<div class="section-body" id="panel-quests"></div>
			</details>

		</div>
		<div id="settings-view">
			<div id="settings-back-row">
				<button data-action="settings-back">Back</button>
			</div>
			<div id="panel-settings"></div>
		</div>
	</div>
	<div id="victory-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="victory-title"></div>
	<div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
	<script src="game.js"></script>
</body>
</html>
